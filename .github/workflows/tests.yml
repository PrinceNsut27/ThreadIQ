name: Python tests

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build deterministic demo database
        run: python scripts/run_pipeline.py --mock-if-missing --recreate-db
      - name: Run test suite
        run: pytest tests/ -v
